services:
  backend:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-movers_crm}
      - DB_USER=${DB_USER:-movers}
      - DB_PASS=${DB_PASS:-changeme}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://cache:6379/0
      - REPORTING_SERVICE_URL=${REPORTING_SERVICE_URL:-http://reporting:8010}
      - REPORTING_SERVICE_TOKEN=${REPORTING_SERVICE_TOKEN:-development-token}
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles
      - media_data:/app/media

  celery_worker:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-movers_crm}
      - DB_USER=${DB_USER:-movers}
      - DB_PASS=${DB_PASS:-changeme}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://cache:6379/0
    volumes:
      - ./backend:/app

  celery_beat:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-movers_crm}
      - DB_USER=${DB_USER:-movers}
      - DB_PASS=${DB_PASS:-changeme}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://cache:6379/0
    volumes:
      - ./backend:/app

  reporting:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]
    environment:
      - REPORTING_SERVICE_TOKEN=${REPORTING_SERVICE_TOKEN:-development-token}
    ports:
      - "8010:8010"
    volumes:
      - ./reporting_service/app:/app/app

  frontend:
    build: !reset null
    image: node:20-alpine
    container_name: movers-crm-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports: !override
      - "5173:5173"
    volumes: !override
      - ./frontend:/app
      - /app/node_modules
    restart: "no"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
